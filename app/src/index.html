<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VersionAble</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply a saved light/dark choice before the first paint, so there's no flash.
      try {
        const theme = JSON.parse(localStorage.getItem("theme"));
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="sidebar-title">
          <h1>VersionAble</h1>
          <div class="sidebar-actions">
            <button id="theme-toggle" class="icon-button" type="button"></button>
            <button id="close-switcher" class="icon-button" type="button" title="Close (Esc)">×</button>
          </div>
        </div>
        <button id="add-project" type="button">+ Add project</button>
      </header>
      <ul id="project-list" class="project-list"></ul>
    </aside>

    <main id="detail" class="detail">
      <p class="placeholder">Select a project</p>
    </main>

    <p id="error" class="error" hidden title="Click to dismiss"></p>
  </body>
</html>
